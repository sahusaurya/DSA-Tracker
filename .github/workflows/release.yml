name: Release

# Windows and Linux installers can't be produced on a Mac, so each one is built on its own
# runner. Tag a version (`git tag v0.1.0 && git push --tags`) and the installers appear on
# the GitHub Releases page.
on:
  push:
    tags: ["v*"]
  # Handy for checking the pipeline without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: dist:mac
          - os: windows-latest
            command: dist:win
          - os: ubuntu-latest
            command: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 asks for >= 22; Electron 43 ships Node 24 at runtime.
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install` would be the usual choice, but npm cannot write a
      # lock file that satisfies every platform: the wasm32-wasi fallbacks behind Tailwind and
      # sharp are optional dependencies it never resolves on macOS, so their own dependencies
      # are absent from the lock and `npm ci` refuses on Windows and Linux. `npm install`
      # still honours the lock and repairs only what's missing for the platform it's on.
      - run: npm install --no-audit --no-fund

      - name: Build installers
        run: npm run ${{ matrix.command }}
        env:
          # Unsigned builds: without this electron-builder tries to discover a certificate
          # and fails the job when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: true
          generate_release_notes: true
          body: |
            Download the file for your system, below.

            These builds are **not code-signed**, so the first launch needs one extra step:

            - **macOS** — right-click the app in Applications and choose *Open*, then *Open*
              again. Only needed once.
            - **Windows** — click *More info*, then *Run anyway*.

            Your notes live in your account's application-data folder and are never uploaded
            anywhere. The app works entirely offline.
