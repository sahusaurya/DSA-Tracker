appId: com.sahusaurya.dsatracker
productName: DSA Tracker
copyright: Copyright © Saurya Aditya Sahu

# Pinned rather than derived from productName. The space in "DSA Tracker" is sanitised
# differently on different code paths, which produced both `DSA-Tracker-0.1.0.dmg` and
# `DSA.Tracker-0.1.0.dmg` for the same build. A download page should offer one obvious file.
artifactName: DSA-Tracker-${version}-${arch}.${ext}

afterPack: ./scripts/adhoc-sign.cjs

directories:
  output: dist
  # Not the conventional `build/`, which .gitignore excludes — the icon must reach CI.
  buildResources: electron/resources

# The application itself is the traced standalone server, shipped as a resource. Only the
# shell goes in the asar — without the negation electron-builder would also pack every
# production dependency, duplicating the ~200 MB that standalone already contains.
# Only the shell goes in the asar. Without the negation electron-builder also packs every
# production dependency, duplicating what standalone already carries (654 MB, measured).
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
  - "!src/**/*"
  - "!scripts/**/*"
  - "!.next/**/*"
  - "!data/**/*"

extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
      # Belt and braces against a developer's own vault reaching an installer.
      - "!data/**/*"
  # electron-builder skips anything named node_modules inside a directory copy — it manages
  # dependencies itself — so the server's own dependencies have to be named explicitly.
  # Without this the app launches and immediately dies with "Cannot find module 'next'".
  - from: .next/standalone/node_modules
    to: standalone/node_modules

asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # No developer certificate, so electron-builder does no signing of its own. The app is
  # ad-hoc signed in afterPack instead — see scripts/adhoc-sign.cjs for why that is required
  # rather than optional.
  identity: null

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  category: Development
  target:
    - AppImage
    - deb
